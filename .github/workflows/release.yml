name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build Linux release bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          for arch in amd64 arm64; do
            bundle_name="telegram-bot-linux-${arch}"
            bundle_dir="dist/${bundle_name}"
            mkdir -p "${bundle_dir}"

            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
              go build -buildvcs=false -trimpath -ldflags="-s -w" \
              -o "${bundle_dir}/telegram-webhook-bot" ./cmd/bot

            install -m 0755 deploy/install.sh deploy/update.sh "${bundle_dir}/"
            install -m 0644 \
              deploy/telegram-bot.service \
              deploy/telegram-bot.env.example \
              deploy/Caddyfile.example \
              "${bundle_dir}/"

            (
              cd "${bundle_dir}"
              sha256sum telegram-webhook-bot > telegram-webhook-bot.sha256
            )

            tar -C dist -czf "dist/${bundle_name}.tar.gz" "${bundle_name}"
            (
              cd dist
              sha256sum "${bundle_name}.tar.gz" > "${bundle_name}.tar.gz.sha256"
            )
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(dist/*.tar.gz dist/*.tar.gz.sha256)

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "${GITHUB_REF_NAME}"
          fi
